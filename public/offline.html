<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline · Hetkin</title>
    <!--
        Static, framework-free by design (MIGRATION_PLAN.md Stage 14) — this
        is what resources/js/service-worker/sw-core.ts serves in place of a
        failed navigation request, so it has to work with zero JS bootstrap,
        zero build step, zero network. Never shown for anything other than a
        genuine network failure; never a stand-in for a real authenticated
        page (see sw-core.ts's fetch handler for why).
    -->
    <style>
        :root {
            color-scheme: light dark;
            --color-bg: #f8fafc;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-border: #e2e8f0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #0f172a;
                --color-text: #f8fafc;
                --color-text-secondary: #94a3b8;
                --color-border: #1e293b;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        svg { color: var(--color-text); flex-shrink: 0; }
        h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
        p { font-size: 0.9rem; color: var(--color-text-secondary); margin: 0; max-width: 28rem; }
        button {
            font: inherit;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            border: 1px solid var(--color-border);
            background: var(--color-text);
            color: var(--color-bg);
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>You&rsquo;re offline</h1>
    <p>Hetkin can&rsquo;t reach the network right now. Check your connection and try again — nothing here is cached or out of date, it just couldn&rsquo;t load.</p>
    <button type="button" onclick="location.reload()">Try again</button>
